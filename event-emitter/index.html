<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./style.css">

    <title>Event Emitter Example</title>
</head>
<body>
    <div id="root">
        <ul class="houses-list"></ul>
        <br>
        <br>

        <div class="controls">
            <button class="load-spells-button">Load spells</button>
            <button class="hide-spells-button">Hide spells</button>
            <button class="load-characters-button">Load Characters</button>
        </div>
        <br>
        <br>

        <ul class="spells-list"></ul>
        <ul class="characters-list"></ul>

        <form class="search-character-form">
            <label for="searchCharacterInput"></label>
            <input type="text" placeholder="Search Character" id="searchCharacterInput" />
            <div>
                <button class="search-button" type="submit">Search</button>
            </div>
        </form>
        <div class="search-results">
            <div class="searched-characters">
                <div>
                    <h3>Characters</h3>
                    <button type="button" data-sort="up" data-type="characters" class="sort-buttons">▲</button>
                    <button type="button" data-sort="down" data-type="characters"  class="sort-buttons">▼</button>
                </div>
                <ul class="searched-characters-list"></ul>
            </div>

            <div class="searched-houses">
                <div>
                    <h3>Houses</h3>
                    <button type="button" data-sort="up" data-type="houses"  class="sort-buttons">▲</button>
                    <button type="button" data-sort="down" data-type="houses" class="sort-buttons">▼</button>
                </div>
                <ul class="searched-houses-list"></ul>
            </div>

            <div class="searched-spells">
                <div>
                    <h3>Spells</h3>
                    <button type="button" data-sort="up" data-type="spells" class="sort-buttons">▲</button>
                    <button type="button"  data-sort="down" data-type="spells" class="sort-buttons">▼</button>
                </div>
                <ul class="searched-spells-list"></ul>
            </div>
            
        </div>

    </div>

    <script type="module" src="./index.js"></script>
</body>
</html>
